name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails:
    name: Rails tests and security scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ruby_service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/victory_garden_test
      SECRET_KEY_BASE: ci-only-secret-key-base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential libpq-dev libyaml-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.3
          bundler-cache: true
          working-directory: ruby_service

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test

      - name: Run Rails security scan
        run: bundle exec brakeman --no-pager --format plain --ensure-ignore-notes --ensure-no-obsolete-ignore-entries

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python_tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_tools/pyproject.toml

      - name: Install Python package and test dependencies
        run: python -m pip install -e . pytest

      - name: Run Python tests
        run: python -m pytest

  firmware-host-tests:
    name: Firmware host tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared
            source: firmware/shared/tests
            build: shared
          - name: sensor node
            source: firmware/pico_w_sensor_node/tests
            build: sensor
          - name: actuator node
            source: firmware/pico_w_actuator_node/tests
            build: actuator
          - name: combined node
            source: firmware/pico_w_combined_node/tests
            build: combined
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host-test build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential cmake

      - name: Configure host tests
        run: cmake -S "${{ matrix.source }}" -B "${{ runner.temp }}/vg-${{ matrix.build }}"

      - name: Build host tests
        run: cmake --build "${{ runner.temp }}/vg-${{ matrix.build }}" --parallel

      - name: Run host tests
        run: ctest --test-dir "${{ runner.temp }}/vg-${{ matrix.build }}" --output-on-failure
