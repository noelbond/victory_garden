name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-tests:
    name: Rails Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: victory_garden_ci
          POSTGRES_PASSWORD: victory_garden_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      RUBY_SERVICE_DATABASE_USERNAME: victory_garden_ci
      RUBY_SERVICE_DATABASE_PASSWORD: victory_garden_ci
      RUBY_SERVICE_DATABASE_HOST: 127.0.0.1
      RUBY_SERVICE_DATABASE_PORT: 5432
      SECRET_KEY_BASE: ci

    defaults:
      run:
        working-directory: ruby_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libpq-dev libyaml-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.3"

      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test

  rails-static-analysis:
    name: Rails Security and Style Baseline
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ruby_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libpq-dev libyaml-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.3"

      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run Brakeman security scan (informational baseline)
        continue-on-error: true
        run: bundle exec brakeman --no-pager --format plain

      - name: Run RuboCop style scan (informational baseline)
        continue-on-error: true
        run: bin/rubocop -f github

  installer-javascript:
    name: Desktop Installer JavaScript
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: desktop_installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop_installer/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Build desktop installer frontend
        run: npm run build

  installer-rust:
    name: Desktop Installer Rust
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: desktop_installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting (informational baseline)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
